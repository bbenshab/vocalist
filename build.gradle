plugins {
    id "net.minecraftforge.gradle" version "[6.0,6.2)"
}

version = "1.0.0"
group = "com.bbenshab.vocalist"

base {
    archivesName = "vocalist"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: "official", version: "1.20.1"
}

repositories {
    maven {
        name = "MaxHenkel"
        url = "https://maven.maxhenkel.de/releases"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.0"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.5.31"
}

jar {
    manifest {
        attributes([
                "Specification-Title"    : "vocalist",
                "Specification-Vendor"   : "Boaz Ben Shabat",
                "Specification-Version"  : "1",
                "Implementation-Title"   : "Vocalist",
                "Implementation-Version" : "1.0.0",
                "Implementation-Vendor"  : "Boaz Ben Shabat"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}
